<!-- Playlist tasks partial for HTMX -->
{% if tasks|length == 0 %}
<p class="text-gray-400">このプレイリストにはタスクがありません</p>
{% else %}
<div class="space-y-2">
    {% for item in schedule %}
    <div class="flex items-center gap-4 bg-gray-800/50 rounded-lg p-3">
        <span class="text-gray-400 w-14">{{ item.start }}</span>
        <span class="flex-1">📝 {{ item.task.title }}</span>
        <span class="text-gray-400">~{{ item.end }}</span>
    </div>
    {% endfor %}
</div>

<p class="text-success mt-4">✅ 予想終了: {{ estimated_end }}</p>

<script>
// タスクデータをJavaScript変数として安全に渡す（バグ2修正: tojsonの代わりに直接JS配列を生成）
(function() {
    var tasksData = [
        {% for t in tasks %}
        {
            "id": {{ t.id|tojson }},
            "title": {{ t.title|tojson }},
            "duration": {{ t.duration|tojson }},
            "break_duration": {{ t.break_duration|tojson }},
            "difficulty": {{ t.difficulty|tojson }},
            "priority": {{ t.priority|tojson }},
            "status": {{ t.status|tojson }},
            "pt_id": {{ t.pt_id|tojson if t.pt_id is defined else 'null' }}
        }{% if not loop.last %},{% endif %}
        {% endfor %}
    ];
    // DOMに埋め込む代わりにwindowオブジェクトに直接設定
    window.__playlistTasksData = tasksData;
})();
</script>
{% endif %}
